[package]
name = "rustytavern-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The essential runtime plugins: drivers, tools, providers, sources, and prompt hooks."

[features]
default = ["mcp"]
mcp = ["dep:rmcp"]

[dependencies]
rustytavern-core.workspace = true
rustytavern-card.workspace = true
rustytavern-conversation.workspace = true
rustytavern-plugin.workspace = true
rustytavern-adapters.workspace = true
rustytavern-runtime.workspace = true
rustytavern-store.workspace = true
async-trait.workspace = true
rmcp = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
